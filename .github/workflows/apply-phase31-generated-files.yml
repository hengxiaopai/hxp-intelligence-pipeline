name: Materialize Phase 3.1 Examples

on:
  push:
    branches: [phase-3-1-editorial-assembly]
    paths:
      - "scripts/generate_editorial_examples.py"
      - ".github/workflows/apply-phase31-generated-files.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: phase-3-1-editorial-assembly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Allow continuation metadata in the briefing contract
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          path = Path("schemas/briefing.schema.json")
          schema = json.loads(path.read_text(encoding="utf-8"))
          continuation = copy.deepcopy(
              schema["$defs"]["continuationItem"]["allOf"][1]["properties"]["continuation"]
          )
          schema["$defs"]["baseItem"]["properties"]["continuation"] = continuation
          schema["$defs"]["newItem"]["allOf"][1]["not"] = {
              "required": ["continuation"]
          }
          path.write_text(
              json.dumps(schema, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate examples
        run: python scripts/generate_editorial_examples.py

      - name: Validate generated examples
        run: |
          python scripts/validate.py --schema schemas/editorial-score.schema.json --data data/examples/editorial-scores.example.json
          python scripts/validate.py --schema schemas/briefing.schema.json --data data/examples/briefing-assembled.example.json
          python -m unittest tests.test_editorial_assembly -v

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/briefing.schema.json data/examples/
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "test(editorial): materialize Phase 3.1 fixtures"
          git push origin HEAD:phase-3-1-editorial-assembly
