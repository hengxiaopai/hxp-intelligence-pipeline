name: Schema Validation

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "config/**"
      - "data/examples/**"
      - "data/daily/**"
      - "data/state/**"
      - "collectors/**"
      - "pipeline/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/schema-validation.yml"
      - ".github/workflows/daily-pipeline.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "config/**"
      - "data/examples/**"
      - "data/daily/**"
      - "data/state/**"
      - "collectors/**"
      - "pipeline/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/schema-validation.yml"
      - ".github/workflows/daily-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Compile pipeline code
        run: >-
          python -m py_compile
          scripts/validate.py
          scripts/source_registry.py
          scripts/validate_candidate.py
          scripts/collect.py
          scripts/normalize_candidate.py
          scripts/dedup_candidate.py
          scripts/score_candidates.py
          scripts/assemble_briefing.py
          scripts/generate_editorial_examples.py
          scripts/run_daily_pipeline.py
          scripts/validate_daily_run.py
          scripts/generate_daily_run_20260729.py
          scripts/plan_daily_run.py
          scripts/execute_collection_plan.py
          scripts/commit_daily_history.py
          scripts/write_failure_report.py
          collectors/__init__.py
          collectors/base.py
          collectors/rss.py
          collectors/html_index.py
          collectors/snapshot.py
          pipeline/__init__.py
          pipeline/normalization.py
          pipeline/dedup.py
          pipeline/editorial_scoring.py
          pipeline/briefing_assembler.py
          pipeline/scheduler.py
          pipeline/history_commit.py
          pipeline/failure_reporting.py
          tests/test_collectors.py
          tests/test_normalization_dedup.py
          tests/test_editorial_assembly.py
          tests/test_daily_run.py
          tests/test_scheduler_history.py

      - name: Validate baseline examples
        run: python scripts/validate.py --examples

      - name: Validate candidate and editorial examples
        run: |
          python scripts/validate.py --schema schemas/candidate.schema.json --data data/examples/candidate.example.json
          python scripts/validate.py --schema schemas/source.schema.json --data data/examples/candidate-source.example.json
          python scripts/validate.py --schema schemas/dedup-index.schema.json --data data/examples/dedup-index.example.json
          python scripts/validate.py --schema schemas/editorial-score.schema.json --data data/examples/editorial-scores.example.json
          python scripts/validate.py --schema schemas/briefing.schema.json --data data/examples/briefing-assembled.example.json

      - name: Validate source registry and production state
        run: |
          python scripts/validate.py --schema schemas/source-registry.schema.json --data config/sources.json
          python scripts/source_registry.py --validate
          python scripts/validate_candidate.py
          python scripts/validate.py --schema schemas/schedule-state.schema.json --data data/state/source-watermarks.json
          python scripts/validate.py --schema schemas/dedup-index.schema.json --data data/state/dedup-index.json

      - name: Validate first archived daily run
        run: |
          python scripts/validate.py --schema schemas/daily-run.schema.json --data data/daily/2026-07-29/run.json
          python scripts/validate_daily_run.py --run-dir data/daily/2026-07-29

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Exercise deterministic source planning
        run: |
          python scripts/plan_daily_run.py \
            --now 2026-07-29T01:00:00Z \
            --mode plan_only \
            --output /tmp/hxp-daily-plan.json
          python scripts/validate.py \
            --schema schemas/daily-plan.schema.json \
            --data /tmp/hxp-daily-plan.json
          python scripts/plan_daily_run.py \
            --now 2026-07-29T01:00:00Z \
            --mode plan_only \
            --output /tmp/hxp-daily-plan-repeat.json
          cmp /tmp/hxp-daily-plan.json /tmp/hxp-daily-plan-repeat.json

      - name: Exercise sanitized failure reporting
        run: |
          python scripts/write_failure_report.py \
            --stage collection \
            --error-type FixtureFailure \
            --message "Authorization: Bearer test.secret token=hidden" \
            --occurred-at 2026-07-29T01:05:00Z \
            --source-registry-id registry-github-changelog \
            --output /tmp/hxp-failure.json
          python scripts/validate.py \
            --schema schemas/failure-report.schema.json \
            --data /tmp/hxp-failure.json
          ! grep -q "test.secret" /tmp/hxp-failure.json
          ! grep -q "token=hidden" /tmp/hxp-failure.json

      - name: Verify pending run cannot advance production history
        shell: bash
        run: |
          set -euo pipefail
          STATE_HASH="$(sha256sum data/state/source-watermarks.json)"
          INDEX_HASH="$(sha256sum data/state/dedup-index.json)"
          if python scripts/commit_daily_history.py \
            --run-dir data/daily/2026-07-29 \
            --apply; then
            echo "Pending run unexpectedly advanced production history" >&2
            exit 1
          fi
          test "$STATE_HASH" = "$(sha256sum data/state/source-watermarks.json)"
          test "$INDEX_HASH" = "$(sha256sum data/state/dedup-index.json)"

      - name: Exercise RSS and HTML fixture CLIs
        run: |
          python scripts/collect.py --registry-id registry-arxiv-cs-ai --input-file tests/fixtures/arxiv-cs-ai.xml --output-dir /tmp/hxp-rss
          python scripts/collect.py --registry-id registry-github-changelog --input-file tests/fixtures/github-changelog.html --output-dir /tmp/hxp-html

      - name: Exercise snapshot to candidate to dedup flow
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="$(find /tmp/hxp-rss -maxdepth 1 -name '*.json' -print -quit)"
          test -n "$SNAPSHOT"
          python scripts/normalize_candidate.py \
            --snapshot "$SNAPSHOT" \
            --source tests/fixtures/arxiv-source.json \
            --item-index 0 \
            --sequence 1 \
            --entity "Example Research Group" \
            --action "发布预印本" \
            --object "可审计 Agent 工作流研究" \
            --primary-category ai_technology \
            --information-type paper \
            --risk-flag unconfirmed \
            --output /tmp/hxp-candidate.json
          python scripts/dedup_candidate.py \
            --candidate /tmp/hxp-candidate.json \
            --index /tmp/hxp-empty-index.json \
            --decision-output /tmp/hxp-decision.json \
            --updated-index-output /tmp/hxp-index.json \
            --apply
          python scripts/validate.py --schema schemas/candidate.schema.json --data /tmp/hxp-candidate.json
          python scripts/validate.py --schema schemas/dedup-decision.schema.json --data /tmp/hxp-decision.json
          python scripts/validate.py --schema schemas/dedup-index.schema.json --data /tmp/hxp-index.json

      - name: Exercise editorial scoring and assembly flow
        run: |
          python scripts/score_candidates.py --pool data/examples/candidate-pool.example.json --output /tmp/hxp-editorial-scores.json
          python scripts/assemble_briefing.py --pool data/examples/candidate-pool.example.json --scores /tmp/hxp-editorial-scores.json --output /tmp/hxp-briefing.json --markdown /tmp/hxp-briefing.md
          python scripts/validate.py --schema schemas/editorial-score.schema.json --data /tmp/hxp-editorial-scores.json
          python scripts/validate.py --schema schemas/briefing.schema.json --data /tmp/hxp-briefing.json
          grep -q "不构成投资建议" /tmp/hxp-briefing.md

      - name: Verify generated outputs are reproducible
        run: |
          python scripts/generate_editorial_examples.py
          python scripts/generate_daily_run_20260729.py
          git diff --exit-code -- data/examples/ data/daily/2026-07-29/
