name: Schema Validation

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "config/**"
      - "data/examples/**"
      - "data/daily/**"
      - "collectors/**"
      - "pipeline/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/schema-validation.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "config/**"
      - "data/examples/**"
      - "data/daily/**"
      - "collectors/**"
      - "pipeline/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/schema-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: phase-3-2-real-daily-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Compile pipeline code
        run: >-
          python -m py_compile
          scripts/validate.py
          scripts/source_registry.py
          scripts/validate_candidate.py
          scripts/collect.py
          scripts/normalize_candidate.py
          scripts/dedup_candidate.py
          scripts/score_candidates.py
          scripts/assemble_briefing.py
          scripts/generate_editorial_examples.py
          scripts/run_daily_pipeline.py
          scripts/validate_daily_run.py
          scripts/generate_daily_run_20260729.py
          collectors/__init__.py
          collectors/base.py
          collectors/rss.py
          collectors/html_index.py
          collectors/snapshot.py
          pipeline/__init__.py
          pipeline/normalization.py
          pipeline/dedup.py
          pipeline/editorial_scoring.py
          pipeline/briefing_assembler.py
          tests/test_collectors.py
          tests/test_normalization_dedup.py
          tests/test_editorial_assembly.py
          tests/test_daily_run.py

      - name: Materialize archived daily run
        run: python scripts/generate_daily_run_20260729.py

      - name: Validate briefing, source, and manifest examples
        run: python scripts/validate.py --examples

      - name: Validate candidate event example
        run: python scripts/validate.py --schema schemas/candidate.schema.json --data data/examples/candidate.example.json

      - name: Validate candidate source example
        run: python scripts/validate.py --schema schemas/source.schema.json --data data/examples/candidate-source.example.json

      - name: Validate dedup history example
        run: python scripts/validate.py --schema schemas/dedup-index.schema.json --data data/examples/dedup-index.example.json

      - name: Validate editorial score example
        run: python scripts/validate.py --schema schemas/editorial-score.schema.json --data data/examples/editorial-scores.example.json

      - name: Validate assembled briefing example
        run: python scripts/validate.py --schema schemas/briefing.schema.json --data data/examples/briefing-assembled.example.json

      - name: Validate source registry
        run: |
          python scripts/validate.py --schema schemas/source-registry.schema.json --data config/sources.json
          python scripts/source_registry.py --validate
          python scripts/validate_candidate.py

      - name: Validate first archived daily run
        run: python scripts/validate_daily_run.py --run-dir data/daily/2026-07-29

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Exercise RSS fixture CLI
        run: python scripts/collect.py --registry-id registry-arxiv-cs-ai --input-file tests/fixtures/arxiv-cs-ai.xml --output-dir /tmp/hxp-rss

      - name: Exercise HTML fixture CLI
        run: python scripts/collect.py --registry-id registry-github-changelog --input-file tests/fixtures/github-changelog.html --output-dir /tmp/hxp-html

      - name: Exercise snapshot to candidate to dedup flow
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="$(find /tmp/hxp-rss -maxdepth 1 -name '*.json' -print -quit)"
          test -n "$SNAPSHOT"
          python scripts/normalize_candidate.py \
            --snapshot "$SNAPSHOT" \
            --source tests/fixtures/arxiv-source.json \
            --item-index 0 \
            --sequence 1 \
            --entity "Example Research Group" \
            --action "发布预印本" \
            --object "可审计 Agent 工作流研究" \
            --primary-category ai_technology \
            --information-type paper \
            --risk-flag unconfirmed \
            --output /tmp/hxp-candidate.json
          python scripts/dedup_candidate.py \
            --candidate /tmp/hxp-candidate.json \
            --index /tmp/hxp-empty-index.json \
            --decision-output /tmp/hxp-decision.json \
            --updated-index-output /tmp/hxp-index.json \
            --apply

      - name: Exercise editorial scoring and assembly flow
        run: |
          python scripts/score_candidates.py --pool data/examples/candidate-pool.example.json --output /tmp/hxp-editorial-scores.json
          python scripts/assemble_briefing.py --pool data/examples/candidate-pool.example.json --scores /tmp/hxp-editorial-scores.json --output /tmp/hxp-briefing.json --markdown /tmp/hxp-briefing.md
          python scripts/validate.py --schema schemas/editorial-score.schema.json --data /tmp/hxp-editorial-scores.json
          python scripts/validate.py --schema schemas/briefing.schema.json --data /tmp/hxp-briefing.json
          grep -q "不构成投资建议" /tmp/hxp-briefing.md

      - name: Verify generated examples and daily run are reproducible
        run: |
          python scripts/generate_editorial_examples.py
          python scripts/generate_daily_run_20260729.py
          git diff --exit-code -- data/examples/

      - name: Commit first archived run package
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily/2026-07-29/
          if git diff --cached --quiet; then
            echo "Archived run already committed"
            exit 0
          fi
          git commit -m "data(daily): archive first real-source run"
          git push origin HEAD:phase-3-2-real-daily-run
