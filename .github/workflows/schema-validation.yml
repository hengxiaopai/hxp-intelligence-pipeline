name: Schema Validation

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "config/**"
      - "data/examples/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - ".github/workflows/schema-validation.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "config/**"
      - "data/examples/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - ".github/workflows/schema-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Compile validation scripts
        run: python -m py_compile scripts/validate.py scripts/source_registry.py

      - name: Validate briefing, source, and manifest examples
        run: python scripts/validate.py --examples

      - name: Validate candidate event example
        run: >-
          python scripts/validate.py
          --schema schemas/candidate.schema.json
          --data data/examples/candidate.example.json

      - name: Validate source registry schema
        run: >-
          python scripts/validate.py
          --schema schemas/source-registry.schema.json
          --data config/sources.json

      - name: Validate source registry policies
        run: python scripts/source_registry.py --validate
