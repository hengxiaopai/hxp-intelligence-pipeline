name: Materialize Phase 3.2 Archived Run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-phase32.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-2-real-daily-run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/generate_daily_run_20260729.py
      - run: python scripts/validate_daily_run.py --run-dir data/daily/2026-07-29
      - run: python -m unittest tests.test_daily_run -v
      - name: Commit generated run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily/2026-07-29/
          git commit -m "data(daily): archive first real-source run"
          git push origin HEAD:phase-3-2-real-daily-run
